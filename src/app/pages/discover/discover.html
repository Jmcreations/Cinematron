<app-hero></app-hero>

<!-- Top 10 Section -->
<section class="catalog">
  <div class="sectionHead">
    <div>
      <p class="kicker">Curated for you</p>
      <h2>Top 10 Today</h2>
    </div>
    <button class="viewAll">View all &rarr;</button>
  </div>
  <div class="grid">
    <app-movie-card *ngFor="let movie of top10 | slice:0:6" [movie]="movie" (cardClick)="openDetails($event)"></app-movie-card>
  </div>
</section>

<!-- Continue Watching (Hides if empty) -->
<section class="catalog" *ngIf="continueWatching.length > 0">
  <div class="sectionHead">
    <div>
      <p class="kicker">Jump back in</p>
      <h2>Continue Watching</h2>
    </div>
  </div>
  <div class="grid">
    <div class="homeContinueCard" *ngFor="let movie of continueWatching">
      <app-movie-card [movie]="movie" (cardClick)="openDetails($event)"></app-movie-card>
      <button class="continueRemove" type="button" aria-label="Remove from Continue Watching"
              (click)="removeFromContinueWatching(movie.id)">
        <app-icon name="close"></app-icon>
      </button>
    </div>
  </div>
</section>

<!-- Dynamic Genre Section -->
<section class="catalog genreCatalog">
  <div class="sectionHead genreSectionHead">
    <div>
      <p class="kicker">Browse by genre</p>

      <div class="genreSelector">
        <button class="genreHeading"
                type="button"
                [attr.aria-expanded]="showGenreDropdown"
                aria-haspopup="listbox"
                (click)="showGenreDropdown = !showGenreDropdown">
          <span>{{ selectedGenre.name }}</span>
          <app-icon name="chevron-down"></app-icon>
        </button>

        <div class="genreDropdown" *ngIf="showGenreDropdown" role="listbox">
          <button type="button" *ngFor="let genre of genres"
                  role="option"
                  [attr.aria-selected]="selectedGenre.id === genre.id"
                  (click)="loadGenreMovies(genre.id, genre.name); $event.stopPropagation()">
            {{ genre.name }}
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="grid">
    <app-movie-card *ngFor="let movie of genreMovies" [movie]="movie" (cardClick)="openDetails($event)"></app-movie-card>
  </div>
</section>
