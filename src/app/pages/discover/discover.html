<app-hero></app-hero>

<!-- Top 10 Section -->
<section class="catalog">
  <div class="sectionHead">
    <div>
      <p class="kicker">Curated for you</p>
      <h2>Top 10 Today</h2>
    </div>
    <button class="viewAll">View all &rarr;</button>
  </div>
  <div class="grid">
    <app-movie-card *ngFor="let movie of top10 | slice:0:6" [movie]="movie" (cardClick)="openDetails($event)"></app-movie-card>
  </div>
</section>

<!-- Continue Watching (Hides if empty) -->
<section class="catalog" *ngIf="continueWatching.length > 0">
  <div class="sectionHead">
    <div>
      <p class="kicker">Jump back in</p>
      <h2>Continue Watching</h2>
    </div>
  </div>
  <div class="grid">
    <app-movie-card *ngFor="let movie of continueWatching" [movie]="movie" (cardClick)="openDetails($event)"></app-movie-card>
  </div>
</section>

<!-- Dynamic Genre Section -->
<section class="catalog" style="position: relative; z-index: 10;">
  <div class="sectionHead" style="position: relative; z-index: 20;">
    <div>
      <p class="kicker">Browse by genre</p>
      
      <div style="position: relative; display: inline-block;">
        <h2 (click)="showGenreDropdown = !showGenreDropdown" style="cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none;">
          {{ selectedGenre.name }} <app-icon name="chevron-down" style="width: 24px; color: var(--plum2);"></app-icon>
        </h2>
        
        <div class="genreDropdown" *ngIf="showGenreDropdown">
          <button *ngFor="let genre of genres" (click)="loadGenreMovies(genre.id, genre.name); $event.stopPropagation()">
            {{ genre.name }}
          </button>
        </div>
      </div>
      
    </div>
  </div>
  
  <div class="grid">
    <app-movie-card *ngFor="let movie of genreMovies" [movie]="movie" (cardClick)="openDetails($event)"></app-movie-card>
  </div>
</section>
