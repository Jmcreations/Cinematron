<!-- brand and navlinks group -->
<!-- Replace the <button class="brand"> with this -->
<a class="brand" routerLink="/">
  <span>C</span> CINEMATRON
</a>

<div class="navlinks">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
  <a routerLink="/list" routerLinkActive="active">My List</a>
</div>

<!-- right-aligned group -->
<label class="search">
  <app-icon name="search"></app-icon>
  <input
    placeholder="Search films, people, genres"
    (input)="onSearch($event)"
    (keyup.enter)="submitSearch($event)"
  />
  <kbd>⌘ K</kbd>
  
  <div class="searchDropdown" *ngIf="searchResults.length">
    <button class="searchResultItem" *ngFor="let result of searchResults" (click)="selectResult(result.id)">
      <div style="display: flex; align-items: center; gap: 10px;">
        <img *ngIf="result.poster_path" [src]="movieService.getImageUrl(result.poster_path, 'w92')" style="width: 32px; height: 48px; border-radius: 4px; object-fit: cover;" />
        <div style="display: flex; flex-direction: column; text-align: left;">
          {{ result.title }}
          <span>({{ result.release_date.substring(0, 4) }})</span>
        </div>
      </div>
    </button>
  </div>
</label>

<div class="navDivider"></div>

<button class="signin" (click)="setAuth(true)">
  <span class="accountIcon"><app-icon name="user"></app-icon></span>
  <span>Sign in</span>
</button>
