<!-- brand and navlinks group -->
<!-- Replace the <button class="brand"> with this -->
  <a href="/" aria-label="Cinematron Home" class="brand">
    <img src="/trlogo.png" alt="" class="brand-image"><span>Cinematron</span>
  </a>

<div class="navlinks">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
  <a routerLink="/list" routerLinkActive="active">My List</a>
</div>

<!-- right-aligned group -->
<label class="search">
  <app-icon name="search"></app-icon>
  <input
    placeholder="Search films, people, genres"
    (input)="onSearch($event)"
    (keyup.enter)="submitSearch($event)"
  />
  <kbd>⌘ K</kbd>

  <div class="searchDropdown" *ngIf="searchResults.length">
    <button class="searchResultItem" *ngFor="let result of searchResults" (click)="selectResult(result)">
      <img *ngIf="result.poster_path" [src]="movieService.getImageUrl(result.poster_path, 'w92')" [alt]="movieService.getTitle(result)" />
      <div style="display: flex; flex-direction: column; text-align: left;">
        {{ movieService.getTitle(result) }}
        <span>{{ movieService.getMediaType(result) === 'tv' ? 'TV Series' : 'Film' }} · {{ movieService.getReleaseDate(result).substring(0, 4) }}</span>
      </div>
    </button>
  </div>
</label>

<div class="navDivider"></div>

<button class="signin" (click)="setAuth(true)">
  <span class="accountIcon"><app-icon name="user"></app-icon></span>
  <span>Sign in</span>
</button>
