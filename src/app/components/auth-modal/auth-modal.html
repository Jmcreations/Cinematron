<div class="overlay authOverlay" role="dialog" aria-modal="true" aria-label="Sign in">
  <div class="auth">
    <button class="close" (click)="closeAuth()" aria-label="Close">
      <app-icon name="close"></app-icon>
    </button>
    <img class="brandMark" src="/trlogo.png" alt="Cinematron" />
    <p class="kicker">Your cinema, curated</p>
    <h2>Welcome to Cinematron</h2>
    <p class="authIntro">Sign in to build your watchlist, rate films, and get recommendations worth watching.</p>
    <button class="google"><b>G</b> Continue with Google</button>
    <div class="divider"><span>or</span></div>
    <label>Email address
      <input type="email" placeholder="you@example.com" />
    </label>
    <button class="primary full">Continue with email</button>
    <p class="legal">By continuing, you agree to our Terms and Privacy Policy.</p>
  </div>
</div>
